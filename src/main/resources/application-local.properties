# Profile "local": chạy không cần SQL Server, dữ liệu lưu file H2 trong ./data
# Chạy: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
server.port=8490
server.servlet.session.tracking-modes=cookie
spring.datasource.url=jdbc:h2:file:./data/hottopik-local;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS dbo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
