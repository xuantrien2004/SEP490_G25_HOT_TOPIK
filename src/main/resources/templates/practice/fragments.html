<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="levelPicker(skill, countI, countII)">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 py-3">
        <div class="btn-group" role="group" th:attr="data-level-switch=${skill}">
            <button type="button" class="btn btn-sm btn-success fw-bold level-button active" data-level="TOPIK_I">
                TOPIK I <span class="badge bg-white text-success ms-1" th:text="${countI}">0</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-success fw-bold level-button" data-level="TOPIK_II">
                TOPIK II <span class="badge bg-light text-dark ms-1" th:text="${countII}">0</span>
            </button>
        </div>
    </div>
</th:block>

<th:block th:fragment="typeGrid(items)">
    <div th:if="${#lists.isEmpty(items)}" class="bg-white border rounded-3 p-4 text-muted">Chưa có dạng câu cho cấp độ này.</div>
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3" th:unless="${#lists.isEmpty(items)}">
        <div class="col" th:each="item : ${items}">
            <article class="bg-white border rounded-3 p-3 h-100 d-flex flex-column">
                <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                    <span class="badge text-bg-light border" th:text="${item.type.code}">I-N1</span>
                    <span class="small text-muted" th:text="|Câu ${item.type.rangeLabel()}|">Câu 1–4</span>
                </div>
                <h2 class="h6 fw-bold mb-2" th:text="${item.type.name}">Dạng câu</h2>
                <div class="small text-muted mb-3" th:text="${item.latestPercent != null} ? |Lần gần nhất: ${item.latestPercent}%| : 'Chưa có kết quả'"></div>
                <div class="mt-auto d-flex gap-2">
                    <a class="btn btn-sm btn-outline-success flex-grow-1" th:href="@{/practice/prepare(typeCode=${item.type.code})}">Mở dạng câu</a>
                </div>
            </article>
        </div>
    </div>
</th:block>
</body></html>
