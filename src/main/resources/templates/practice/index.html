<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background: var(--ssak-bg, #F4F3EF); color: var(--ssak-text-main, #24363D);">
<div th:replace="~{fragments/navbar :: navbar('practice')}"></div>
<main class="container py-4" style="max-width: 1200px; min-height: 85vh;">
    <div class="mb-4">
        <h1 class="h2 fw-bold mb-1" style="font-family: var(--font-heading, sans-serif);">Luyện tập</h1>
        <p class="text-muted mb-0">Chọn kỹ năng và cấp độ để xem các dạng câu.</p>
    </div>

    <div th:if="${practiceError}" class="alert alert-warning" th:text="${practiceError}"></div>

    <ul class="nav nav-pills nav-fill p-2 rounded-3 mb-3 bg-white border" id="skillTabs" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active fw-bold py-3" id="tab-listening" data-bs-toggle="tab" data-bs-target="#content-listening" type="button" role="tab">🎧 Kỹ năng Nghe</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link fw-bold py-3" id="tab-reading" data-bs-toggle="tab" data-bs-target="#content-reading" type="button" role="tab">📖 Kỹ năng Đọc</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link fw-bold py-3" id="tab-writing" data-bs-toggle="tab" data-bs-target="#content-writing" type="button" role="tab">✍️ Kỹ năng Viết</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="content-listening" role="tabpanel">
            <div th:replace="~{practice/fragments :: levelPicker('listening', ${listeningI.size()}, ${listeningII.size()})}"></div>
            <section class="practice-track listening-track" data-track="TOPIK_I">
                <div th:replace="~{practice/fragments :: typeGrid(${listeningI})}"></div>
            </section>
            <section class="practice-track listening-track d-none" data-track="TOPIK_II">
                <div th:replace="~{practice/fragments :: typeGrid(${listeningII})}"></div>
            </section>
        </div>

        <div class="tab-pane fade" id="content-reading" role="tabpanel">
            <div th:replace="~{practice/fragments :: levelPicker('reading', ${readingI.size()}, ${readingII.size()})}"></div>
            <section class="practice-track reading-track" data-track="TOPIK_I">
                <div th:replace="~{practice/fragments :: typeGrid(${readingI})}"></div>
            </section>
            <section class="practice-track reading-track d-none" data-track="TOPIK_II">
                <div th:replace="~{practice/fragments :: typeGrid(${readingII})}"></div>
            </section>
        </div>

        <div class="tab-pane fade" id="content-writing" role="tabpanel">
            <div th:replace="~{practice/fragments :: levelPicker('writing', 0, ${writingII.size()})}"></div>
            <section class="practice-track writing-track d-none" data-track="TOPIK_I">
                <div class="bg-white border rounded-3 p-4">
                    <h2 class="h5 fw-bold">TOPIK I không có phần thi Viết</h2>
                    <p class="text-muted mb-0">Kỹ năng Viết có trong TOPIK II.</p>
                </div>
            </section>
            <section class="practice-track writing-track" data-track="TOPIK_II">
                <div th:replace="~{practice/fragments :: typeGrid(${writingII})}"></div>
            </section>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
    function setLevel(skill, level) {
        document.querySelectorAll('.' + skill + '-track').forEach(section => {
            section.classList.toggle('d-none', section.dataset.track !== level);
        });
        document.querySelectorAll('[data-level-switch="' + skill + '"] .level-button').forEach(button => {
            const selected = button.dataset.level === level;
            button.classList.toggle('active', selected);
            button.classList.toggle('btn-success', selected);
            button.classList.toggle('btn-outline-success', !selected);
        });
    }
    document.querySelectorAll('[data-level-switch]').forEach(group => {
        group.querySelectorAll('.level-button').forEach(button => button.addEventListener('click', () => {
            setLevel(group.dataset.levelSwitch, button.dataset.level);
        }));
    });
    ['listening', 'reading', 'writing'].forEach(skill => setLevel(skill, 'TOPIK_I'));
    document.querySelectorAll('#skillTabs [data-bs-toggle="tab"]').forEach(button => {
        button.addEventListener('shown.bs.tab', event => {
            const skill = event.target.id.substring(4);
            setLevel(skill, 'TOPIK_I');
        });
    });
    const initialSkill = /*[[${initialSkill}]]*/ null;
    const initialTrack = /*[[${initialTrack}]]*/ null;
    if (initialSkill) {
        const tabButton = document.getElementById('tab-' + initialSkill.toLowerCase());
        if (tabButton) {
            tabButton.addEventListener('shown.bs.tab', () => {
                if (initialTrack) setLevel(initialSkill.toLowerCase(), initialTrack);
            }, { once: true });
            bootstrap.Tab.getOrCreateInstance(tabButton).show();
        }
        if (initialTrack) setLevel(initialSkill.toLowerCase(), initialTrack);
    }
    });
</script>
</body>
</html>
