<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background:#F8F6EF;color:#24363D;font-family:var(--font-body)">
<div th:replace="~{fragments/navbar :: navbar('practice')}"></div>
<th:block th:replace="~{fragments/question-player :: assets}"></th:block>
<main class="container-fluid py-4" style="max-width:1440px;min-height:85vh">
    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><a th:href="@{/practice/prepare(typeCode=${type.code})}">← Tạm dừng</a>
            <h1 class="h4 mt-2 mb-1" th:text="${type.name}"></h1>
            <span th:text="${type.track.label + ' · ' + type.skill.label}"></span>
        </div>
        <strong id="timerDisplay" class="font-monospace">00:00</strong>
    </header>
    <!--
        Form nộp bài giữ endpoint cũ; data-report-attempt-* cho modal biết chính xác lượt báo lỗi.
        Fragment chung chỉ đổi phần trình bày; submit vẫn gửi answer_<questionId> cho PracticeController.
    -->
    <form id="practiceForm" method="post" th:action="@{/practice/submit/{id}(id=${attempt.id})}"
          data-report-attempt-kind="PRACTICE" th:attr="data-report-attempt-id=${attempt.id}">
        <div th:replace="~{fragments/question-player :: player(${playerQuestions}, false, ${null}, ${'Luyện tập: ' + type.name})}"></div>
    </form>
</main>
<div th:replace="~{fragments/report-modal :: reportModal}"></div>
<div th:replace="~{fragments/report-modal :: reportScript}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
    let seconds = 0;
    setInterval(() => {
        seconds++;
        document.getElementById('timerDisplay').textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    }, 1000);
</script>
</body></html>
