<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body);">
<div th:replace="~{fragments/navbar :: navbar('practice')}"></div>
<main class="container py-5" style="max-width: 860px;">
    <div th:if="${placementError}" class="alert alert-warning" th:text="${placementError}"></div>
    <section class="bg-white border rounded-4 p-4 p-md-5 shadow-sm">
        <span class="badge text-bg-light border" th:text="${result.paper.title()}">Bài TOPIK I</span>
        <h1 class="mt-3 mb-2" style="font-family: var(--font-heading); font-weight: 800;" th:text="${result.levelLabel}">TOPIK 2</h1>
        <p class="fs-5 mb-1" th:text="${result.scoreLine}">Bạn đúng 17/20 câu → 170/200 điểm (85%).</p>
        <p class="text-muted" th:text="${result.message}">Bạn đạt từ 80%.</p>

        <div class="row g-3 my-4">
            <div class="col-6">
                <div class="p-3 rounded-3" style="background: var(--ssak-bg);">
                    <small class="text-muted d-block fw-bold">Nghe</small>
                    <span class="fs-4 fw-bold" th:text="${listenPoints} + ' / ' + ${result.attempt.listenTotal * 10}">80 / 100</span>
                </div>
            </div>
            <div class="col-6">
                <div class="p-3 rounded-3" style="background: var(--ssak-bg);">
                    <small class="text-muted d-block fw-bold">Đọc</small>
                    <span class="fs-4 fw-bold" th:text="${readPoints} + ' / ' + ${result.attempt.readTotal * 10}">90 / 100</span>
                </div>
            </div>
        </div>

        <div th:if="${result.offerTopikII}" class="alert alert-success">
            Bạn đạt từ 80% bài TOPIK I. Làm tiếp bài TOPIK II để xác định cấp 3–6, hoặc giữ TOPIK I và chọn mục tiêu.
        </div>

        <div class="d-flex flex-wrap gap-2">
            <a th:if="${result.offerTopikII}" class="btn btn-success fw-bold px-4 py-2 rounded-3"
               th:href="@{/placement(paper='TOPIK_II')}">Làm bài TOPIK II</a>
            <a class="btn btn-outline-secondary fw-bold px-4 py-2 rounded-3"
               th:href="@{/placement/muc-tieu(attempt=${result.attempt.id},track=${stayTrack})}">Chọn mục tiêu và sinh lộ trình</a>
        </div>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
