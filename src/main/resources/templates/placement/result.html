<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body);">
<div th:replace="~{fragments/navbar :: navbar('placement')}"></div>
<main class="container py-5" style="max-width: 980px;">
    <div th:if="${placementError}" class="alert alert-warning" th:text="${placementError}"></div>
    <section class="bg-white border rounded-4 p-4 p-md-5 shadow-sm">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="fw-bold" style="font-family: var(--font-heading); font-size: 56px; line-height: 1; color: var(--ssak-primary);"
                     th:text="${result.attempt.points} + '/' + ${maxPoints}">60/200</div>
                <div class="fs-4 fw-bold mt-2" th:text="${result.levelLabel}">Chưa đạt cấp 1</div>
                <p class="mb-1 mt-3">Nghe <span th:text="${listenPoints} + '/100'">0/100</span></p>
                <p class="mb-1">Đọc <span th:text="${readPoints} + '/100'">0/100</span></p>
                <p class="text-muted mb-3" th:text="'Bạn đúng ' + ${result.attempt.correctCount} + '/' + ${result.attempt.total} + ' câu'">Bạn đúng 6/20 câu</p>
                <a class="btn btn-outline-success fw-bold rounded-pill px-4"
                   th:href="@{/placement/result/{id}/chi-tiet(id=${result.attempt.id})}">Xem chi tiết bài kiểm tra</a>
            </div>
            <div class="col-md-7">
                <h2 class="h4 fw-bold mb-3" style="font-family: var(--font-heading);">Gợi ý</h2>
                <div class="p-3 rounded-3 mb-3" style="background: #FBF0D3;" th:text="${result.message}">Câu gợi ý</div>
                <form method="get" th:action="@{/placement/muc-tieu}" class="d-flex flex-column gap-3">
                    <input type="hidden" name="attempt" th:value="${result.attempt.id}">
                    <div class="track-card d-block p-3 rounded-4 border mb-0"
                         th:each="choice : ${choices}"
                         th:classappend="${choice.suggested} ? 'is-on'">
                        <span class="badge rounded-pill mb-2"
                              th:style="${choice.suggested} ? 'background: var(--ssak-primary);' : 'background: #5C6E72;'"
                              th:text="${choice.label}">Nên chọn</span>
                        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2">
                            <span class="d-flex align-items-center gap-2 fw-bold pb-2">
                                <input class="form-check-input mt-0" type="radio" name="track"
                                       th:value="${choice.track.name()}" th:checked="${choice.suggested}">
                                <span th:text="'Lộ trình ' + ${choice.track.label}">Lộ trình TOPIK I</span>
                            </span>
                            <label class="mb-0" style="min-width: 220px;">
                                <span class="d-block small fw-bold mb-1">Mục tiêu</span>
                                <select class="form-select level-select" th:name="${choice.field}">
                                    <option th:each="item : ${choice.targets}" th:value="${item.level}"
                                            th:selected="${item.level == choice.defaultTarget}"
                                            th:text="${item.option}">TOPIK 2 · Sơ cấp 2</option>
                                </select>
                            </label>
                        </div>
                        <small class="d-block text-muted mt-2" th:text="${choice.span}">Cấp 1–2 · sơ cấp</small>
                    </div>
                    <button class="btn-ssak-primary py-3 rounded-pill fw-bold" type="submit">Tiếp tục</button>
                </form>
            </div>
        </div>
    </section>
</main>
<style>
    .track-card { cursor: pointer; background: #fff; }
    .track-card.is-on { border-color: var(--ssak-primary) !important; background: #E3F2EA; }
</style>
<script>
    function paintTracks(root) {
        root.querySelectorAll('.track-card').forEach(function (card) {
            var radio = card.querySelector('input[type="radio"]');
            card.classList.toggle('is-on', !!(radio && radio.checked));
        });
    }
    var trackForm = document.querySelector('form[action*="muc-tieu"]') || document.querySelector('main form');
    if (trackForm) {
        trackForm.querySelectorAll('.track-card').forEach(function (card) {
            card.addEventListener('click', function (event) {
                if (event.target.closest('select, option')) return;
                var radio = card.querySelector('input[type="radio"]');
                if (!radio || radio.checked) return;
                radio.checked = true;
                radio.dispatchEvent(new Event('change', {bubbles: true}));
            });
        });
        trackForm.addEventListener('change', function (event) {
            if (event.target.name === 'track') paintTracks(trackForm);
        });
        paintTracks(trackForm);
    }
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
