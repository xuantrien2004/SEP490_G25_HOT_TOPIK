<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body);">
<header class="py-3 px-3 px-md-4 bg-white border-bottom shadow-sm sticky-top">
    <div class="d-flex justify-content-between align-items-center gap-3" style="max-width: 1140px; margin: 0 auto;">
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-outline-secondary rounded-pill px-3"
               th:href="@{/placement/result/{id}(id=${attempt.id})}">← Kết quả</a>
            <div>
                <div class="fw-bold" style="font-family: var(--font-heading); color: var(--ssak-primary);">Chi tiết bài kiểm tra</div>
                <div class="small text-muted" id="progressLabel">Câu 1 / 20</div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 small fw-bold">
            <span class="px-3 py-1 rounded-pill" style="background: #E3F2EA; color: #1F6B56;" th:text="'Đúng ' + ${right}">Đúng 3</span>
            <span class="px-3 py-1 rounded-pill" style="background: #FEE2E2; color: #B91C1C;" th:text="'Sai ' + ${wrong}">Sai 12</span>
            <span class="px-3 py-1 rounded-pill bg-light border" th:text="'Chưa làm ' + ${blank}">Chưa làm 5</span>
        </div>
    </div>
</header>
<main class="container my-4" style="max-width: 1140px;">
    <div class="row g-4">
        <div class="col-lg-8">
            <article class="q-card p-4 p-md-5 rounded-4 bg-white border shadow-sm"
                     th:each="item : ${items}" th:classappend="${item.question.no > 1} ? 'd-none'">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                    <span class="badge rounded-pill px-3 py-2" style="background: var(--ssak-primary);"
                          th:text="${item.question.skill} + ' · Câu ' + ${item.question.no}">Nghe · Câu 1</span>
                    <span class="badge rounded-pill bg-light text-muted border" th:text="${item.question.typeName}">Dạng</span>
                    <span th:if="${item.selected == null}" class="badge bg-light text-muted border">Chưa làm</span>
                    <span th:if="${item.correct}" class="badge bg-success-subtle text-success-emphasis border border-success">Đúng</span>
                    <span th:if="${item.selected != null and !item.correct}" class="badge bg-danger-subtle text-danger-emphasis border border-danger">Chưa đúng</span>
                </div>
                <div class="p-3 rounded-4 mb-3" th:if="${item.question.audio != null}" style="background: #E4EEF5;">
                    <div class="small fw-bold mb-2">Đoạn nghe</div>
                    <audio class="w-100" controls preload="none" th:src="${item.question.audio}"></audio>
                </div>
                <img th:if="${item.question.image != null}" th:src="${item.question.image}" alt="" class="img-fluid rounded-3 border mb-3" style="max-height: 240px;">
                <p class="fw-bold" th:if="${item.question.instruction != null and !item.question.instruction.isBlank()}" th:text="${item.question.instruction}"></p>
                <div class="p-3 rounded-3 mb-3" th:if="${item.question.passage != null and !item.question.passage.isBlank()}"
                     style="background: #FAF8F5; white-space: pre-line;" th:text="${item.question.passage}"></div>
                <p class="fw-semibold" th:text="${item.question.prompt}">Đề</p>
                <p th:if="${item.selected == null}" class="text-muted">Bạn chưa chọn đáp án cho câu này.</p>
                <div class="d-flex flex-column gap-2">
                    <div class="opt p-3 rounded-3 border d-flex align-items-center gap-3"
                         th:each="opt, iter : ${item.question.options}"
                         th:classappend="${iter.count == item.question.answer} ? 'is-right' : (${item.selected != null and iter.count == item.selected and !item.correct} ? 'is-wrong' : '')">
                        <span class="option-no fw-bold d-flex align-items-center justify-content-center rounded-circle border"
                              style="width: 28px; height: 28px; font-size: 13px; flex: 0 0 28px;"
                              th:text="${iter.count == 1 ? '①' : (iter.count == 2 ? '②' : (iter.count == 3 ? '③' : '④'))}">①</span>
                        <img th:if="${item.question.mediaBase != null and (opt.endsWith('.png') or opt.endsWith('.jpg') or opt.endsWith('.jpeg') or opt.endsWith('.webp') or opt.endsWith('.gif'))}"
                             th:src="${item.question.mediaBase + opt}" alt="" style="height: 72px;" class="rounded border">
                        <span th:unless="${item.question.mediaBase != null and (opt.endsWith('.png') or opt.endsWith('.jpg') or opt.endsWith('.jpeg') or opt.endsWith('.webp') or opt.endsWith('.gif'))}"
                              th:text="${opt}">Đáp án</span>
                        <span th:if="${iter.count == item.question.answer and item.correct}" class="badge bg-success text-white ms-auto">Bạn đã chọn đúng</span>
                        <span th:if="${iter.count == item.question.answer and !item.correct}" class="badge bg-success text-white ms-auto">Đáp án đúng</span>
                        <span th:if="${item.selected != null and iter.count == item.selected and !item.correct}" class="badge bg-danger text-white ms-auto">Bạn đã chọn</span>
                    </div>
                </div>
                <div class="p-3 rounded-3 border mt-3" style="background: #FFFDF0; border-color: #FDE68A !important;">
                    <div class="fw-bold text-warning-emphasis mb-1" style="font-size: 13px;">LỜI GIẢI THÍCH CHI TIẾT</div>
                    <div style="line-height: 1.6;"
                         th:text="${item.question.explanation != null and !item.question.explanation.isBlank()} ? ${item.question.explanation} : ('Đáp án chính xác là phương án ' + ${item.question.answer} + '.')"></div>
                    <div class="mt-3 pt-3 border-top" th:if="${item.question.script != null and !item.question.script.isBlank()}">
                        <div class="small fw-bold text-muted mb-1">LỜI THOẠI BÀI NGHE</div>
                        <div style="white-space: pre-line;" th:text="${item.question.script}"></div>
                    </div>
                </div>
                <div class="d-flex justify-content-between pt-4 mt-4 border-top">
                    <button class="btn btn-outline-secondary rounded-pill" type="button" onclick="moveQuestion(-1)">Câu trước</button>
                    <button class="btn-ssak-primary rounded-pill px-4" type="button" onclick="moveQuestion(1)">Câu tiếp</button>
                </div>
            </article>
        </div>
        <div class="col-lg-4">
            <div class="p-4 rounded-4 bg-white border shadow-sm">
                <div class="fw-bold mb-3">Phiếu câu hỏi</div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="q-nav btn btn-sm rounded-circle" type="button" style="width: 40px; height: 40px;"
                            th:each="item : ${items}" th:text="${item.question.no}"
                            th:classappend="${item.correct} ? 'is-right' : (${item.selected == null} ? '' : 'is-wrong')"
                            th:attr="data-index=${item.question.no - 1}">1</button>
                </div>
                <div class="d-flex flex-column gap-1 mt-3 small text-muted">
                    <span><i class="nav-swatch right"></i> Đúng</span>
                    <span><i class="nav-swatch wrong"></i> Sai</span>
                    <span><i class="nav-swatch"></i> Chưa làm</span>
                </div>
            </div>
        </div>
    </div>
</main>
<style>
    .opt.is-right { background: #DCFCE7 !important; border-color: #16A34A !important; }
    .opt.is-right .option-no { background: #16A34A; color: #fff; border-color: #16A34A !important; }
    .opt.is-wrong { background: #FEE2E2 !important; border-color: #DC2626 !important; }
    .opt.is-wrong .option-no { background: #DC2626; color: #fff; border-color: #DC2626 !important; }
    .q-nav { background: #fff !important; color: #24363D !important; border: 1.5px solid #D5D0C4 !important; font-weight: 700; }
    .q-nav.is-right { background: #1F6B56 !important; color: #fff !important; border-color: #1F6B56 !important; }
    .q-nav.is-wrong { background: #DC2626 !important; color: #fff !important; border-color: #DC2626 !important; }
    .q-nav.is-current { box-shadow: 0 0 0 3px #F4F3EF, 0 0 0 5px #24363D; }
    .nav-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #D5D0C4; background: #fff; vertical-align: -2px; margin-right: 6px; }
    .nav-swatch.right { background: #1F6B56; border-color: #1F6B56; }
    .nav-swatch.wrong { background: #DC2626; border-color: #DC2626; }
</style>
<script>
    const cards = [...document.querySelectorAll('.q-card')];
    const nav = [...document.querySelectorAll('.q-nav')];
    let index = 0;
    function showQuestion(next) {
        index = Math.max(0, Math.min(cards.length - 1, next));
        cards.forEach((card, i) => card.classList.toggle('d-none', i !== index));
        nav.forEach((button, i) => button.classList.toggle('is-current', i === index));
        document.getElementById('progressLabel').textContent = 'Câu ' + (index + 1) + ' / ' + cards.length;
    }
    function moveQuestion(step) { showQuestion(index + step); }
    nav.forEach(button => button.addEventListener('click', () => showQuestion(Number(button.dataset.index))));
    document.addEventListener('keydown', event => {
        if (event.target.matches('input, textarea, button')) return;
        if (event.key === 'ArrowRight') showQuestion(index + 1);
        if (event.key === 'ArrowLeft') showQuestion(index - 1);
    });
    if (cards.length) showQuestion(0);
</script>
</body>
</html>
