<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/billing.css}">
<div class="bl-admin">
    <aside th:replace="~{fragments/billing :: sidebar}"></aside>
    <main class="bl-main">
        <div class="bl-crumb"><a th:href="@{/operation}">Vận hành</a> › Học viên Premium</div>
        <h1 class="bl-title">Học viên đang dùng Premium</h1>
        <p class="bl-subtitle">Chỉ xem. Premium chỉ được cấp/gia hạn tự động sau khi thanh toán Sandbox được xác nhận.</p>

        <div class="bl-card bl-table-wrap" style="padding:0;margin-top:16px;">
            <div th:if="${users.empty}" class="bl-empty"><span class="icon">⭐</span>Chưa có học viên nào đang dùng Premium.</div>
            <table class="bl-table" th:unless="${users.empty}">
                <thead><tr><th>Học viên</th><th>Email</th><th>Gói</th><th>Bắt đầu</th><th>Hết hạn</th><th>Còn lại</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users.content}">
                    <td th:text="${u.userName}">Tên</td>
                    <td th:text="${u.userEmail}">email</td>
                    <td th:text="${u.planName}">Premium</td>
                    <td th:text="${u.startsAtText}">--</td>
                    <td th:text="${u.endsAtText}">--</td>
                    <td><span class="bl-status" th:classappend="${u.expiringSoon} ? 'st-PENDING' : 'st-ACTIVE'"
                              th:text="${u.remainingDays >= 0 ? u.remainingDays + ' ngày' : 'Không thời hạn'}">30 ngày</span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:replace="~{fragments/billing :: pager(${users})}"></div>
    </main>
</div>
</body>
</html>
