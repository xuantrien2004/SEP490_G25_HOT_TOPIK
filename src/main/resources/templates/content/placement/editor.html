<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="cm-shell">
    <aside th:replace="~{fragments/content-shell :: sidebar('placement')}"></aside>
    <div class="cm-shell-main">
        <header th:replace="~{fragments/content-shell :: header('Đề kiểm tra trình độ', 'Mỗi bài khóa đúng 10 Nghe + 10 Đọc. Chỉ dạng một câu.')}"></header>
        <div class="p-3 p-md-4">
            <div th:if="${flashOk}" class="alert alert-success" th:text="${flashOk}"></div>
            <div th:if="${flashError}" class="alert alert-danger" th:text="${flashError}"></div>
            <section class="bg-white border rounded-4 p-4 mb-4" th:each="sheet : ${papers}">
                <h2 class="h5 fw-bold" th:text="${sheet.paper.title()}">Bài TOPIK I</h2>
                <p class="text-muted">Nghe <strong th:text="${sheet.listeningCount}">0</strong>/10 · Đọc <strong th:text="${sheet.readingCount}">0</strong>/10</p>
                <form method="post" th:action="@{/content/placement}">
                    <input type="hidden" name="paper" th:value="${sheet.paper.name()}">
                    <h3 class="h6">Nghe</h3>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6" th:each="row : ${sheet.listening}">
                            <label class="form-label small mb-1">
                                <span th:text="${row.type.code()}">I-N1</span> · <span th:text="${row.type.name()}">Dạng</span>
                                <span class="text-muted" th:text="'(' + ${row.available} + ' câu sẵn)'"></span>
                            </label>
                            <input class="form-control" type="number" min="0" max="10" th:name="${row.type.code()}" th:value="${row.count}" th:disabled="${!canEdit}">
                        </div>
                    </div>
                    <h3 class="h6">Đọc</h3>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6" th:each="row : ${sheet.reading}">
                            <label class="form-label small mb-1">
                                <span th:text="${row.type.code()}">I-D1</span> · <span th:text="${row.type.name()}">Dạng</span>
                                <span class="text-muted" th:text="'(' + ${row.available} + ' câu sẵn)'"></span>
                            </label>
                            <input class="form-control" type="number" min="0" max="10" th:name="${row.type.code()}" th:value="${row.count}" th:disabled="${!canEdit}">
                        </div>
                    </div>
                    <button class="btn btn-success" type="submit" th:if="${canEdit}">Lưu cấu trúc</button>
                </form>
            </section>
        </div>
    </div>
</div>
</body>
</html>
