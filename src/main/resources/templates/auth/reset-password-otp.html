<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu bằng mã OTP · HOT TOPIK')}"></head>
<body>
<div style="min-width: 1280px; max-width: 1440px; min-height: 100vh; margin: 0 auto; background: var(--ssak-bg); display: flex;">

    <!-- Left Brand Column -->
    <div style="width: 580px; padding: 64px 72px; background: var(--ssak-primary-light); color: var(--ssak-primary-dark); display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <a th:href="@{/}" style="color: var(--ssak-primary-dark); text-decoration: none; font-family: var(--font-heading); font-size: 26px; font-weight: 800;">
                HOT TOPIK
            </a>
            <div style="margin-top: 40px; display: flex; justify-content: center;">
                <div th:replace="~{fragments/ssak :: mascot('think', 'bloom', 220, 'Bé Ssak suy nghĩ bảo mật')}"></div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <span class="korean-text" style="font-size: 64px; font-weight: 800; color: #1F6B56; line-height: 1;">비밀번호 찾기</span>
            <h1 style="margin: 0; font-family: var(--font-heading); font-size: 32px; line-height: 1.25; color: var(--ssak-primary-dark);">
                Khôi phục mật khẩu tài khoản
            </h1>
            <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3A695B;">
                Nhập mã OTP 6 số gửi đến email của bạn và thiết lập mật khẩu mới an toàn.
            </p>
        </div>
    </div>

    <!-- Right Form Column -->
    <div style="flex-grow: 1; padding: 64px 80px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px;">

            <div>
                <h2 style="font-family: var(--font-heading); font-size: 28px; font-weight: 800; color: var(--ssak-text-main); margin-bottom: 6px;">
                    🔑 Đặt lại mật khẩu
                </h2>
                <p style="font-size: 14.5px; color: var(--ssak-text-muted); line-height: 1.5; margin: 0;">
                    Mã xác nhận đã gửi đến: <strong style="color: var(--ssak-primary-dark);" th:text="${email}">ban@example.com</strong>
                </p>
            </div>

            <!-- Error Banner -->
            <div th:if="${errorMessage != null}" style="padding: 14px 18px; border-radius: 14px; background: #FFF1F0; border: 1.5px solid #FFA39E; color: #CF1322; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                <span>⚠️</span>
                <span th:text="${errorMessage}">Thông báo lỗi</span>
            </div>

            <!-- Success Banner -->
            <div th:if="${successMessage != null}" style="padding: 14px 18px; border-radius: 14px; background: #F6FFED; border: 1.5px solid #B7EB8F; color: #389E0D; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                <span>✅</span>
                <span th:text="${successMessage}">Thao tác thành công</span>
            </div>

            <!-- Reset Form -->
            <form th:action="@{/reset-password-otp}" method="post" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="hidden" name="email" th:value="${email}">

                <div>
                    <label style="font-size: 13px; font-weight: 800; color: var(--ssak-text-muted); text-transform: uppercase;">Mã OTP (6 chữ số)</label>
                    <input type="text" id="otpCode" name="otpCode" maxlength="6" autofocus required
                           class="ssak-input"
                           placeholder="••••••"
                           style="margin-top: 6px; text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 8px; height: 52px; font-family: monospace; color: var(--ssak-primary-dark); background: #FFFFFF;">
                </div>

                <!-- Countdown & Resend -->
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ssak-text-muted); margin-top: -6px;">
                    <span>Hết hạn sau: <strong id="countdownTimer" style="color: #CF1322;">05:00</strong></span>
                    <a th:href="@{/resend-reset-otp(email=${email})}" class="btn-ssak-link" style="font-weight: 700;">
                        Gửi lại mã OTP
                    </a>
                </div>

                <div>
                    <label style="font-size: 13px; font-weight: 800; color: var(--ssak-text-muted); text-transform: uppercase;">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" class="ssak-input" placeholder="Tối thiểu 6 ký tự" required style="margin-top: 6px;">
                </div>

                <div>
                    <label style="font-size: 13px; font-weight: 800; color: var(--ssak-text-muted); text-transform: uppercase;">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="ssak-input" placeholder="Nhập lại đúng mật khẩu mới" required style="margin-top: 6px;">
                </div>

                <button type="submit" class="btn-ssak-primary" style="width: 100%; height: 50px; font-size: 16px; font-weight: 800; margin-top: 6px;">
                    Đổi mật khẩu & Đăng nhập
                </button>
            </form>

            <div style="text-align: center; margin-top: 6px;">
                <a th:href="@{/login}" class="btn-ssak-link" style="font-size: 14px; font-weight: 700;">
                    ← Quay lại màn hình Đăng nhập
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    let timeLeft = 300;
    const timerElem = document.getElementById('countdownTimer');
    const countdown = setInterval(function() {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerElem.textContent = 'Đã hết hạn';
        } else {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElem.textContent = (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }
    }, 1000);

    const otpInput = document.getElementById('otpCode');
    otpInput.addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '');
    });
</script>
</body>
</html>
