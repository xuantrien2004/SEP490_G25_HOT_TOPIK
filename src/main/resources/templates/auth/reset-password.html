<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đặt lại mật khẩu mới · HOT TOPIK')}"></head>
<body>
<div style="min-width: 1280px; max-width: 1440px; min-height: 100vh; margin: 0 auto; background: var(--ssak-bg); display: flex;">

    <!-- Left Brand Column -->
    <div style="width: 580px; padding: 64px 72px; background: var(--ssak-primary-light); color: var(--ssak-primary-dark); display: flex; flex-direction: column; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <a th:href="@{/}" style="color: var(--ssak-primary-dark); text-decoration: none; font-family: var(--font-heading); font-size: 26px; font-weight: 800;">
                HOT TOPIK
            </a>
            <div style="margin-top: 40px; display: flex; justify-content: center;">
                <div th:replace="~{fragments/ssak :: mascot('cheer', 'bloom', 220, 'Bé Ssak nở hoa')}"></div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <span class="korean-text" style="font-size: 64px; font-weight: 800; color: #1F6B56; line-height: 1;">비밀번호 재설정</span>
            <h1 style="margin: 0; font-family: var(--font-heading); font-size: 32px; line-height: 1.25; color: var(--ssak-primary-dark);">
                Khôi phục tài khoản của bạn
            </h1>
            <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3A695B;">
                Bảo mật tài khoản là bước đầu tiên để an tâm luyện tập mỗi ngày cùng Bé Ssak.
            </p>
        </div>
    </div>

    <!-- Right Form Column -->
    <div style="flex-grow: 1; padding: 64px 80px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px;">

            <div>
                <h2 style="font-family: var(--font-heading); font-size: 28px; font-weight: 800; color: var(--ssak-text-main); margin-bottom: 8px;">
                    🔑 Đặt lại mật khẩu
                </h2>
                <p style="font-size: 14.5px; color: var(--ssak-text-muted); line-height: 1.5; margin: 0;">
                    Vui lòng nhập mật khẩu mới cho tài khoản của bạn (tối thiểu 6 ký tự).
                </p>
            </div>

            <!-- Error Banner -->
            <div th:if="${errorMessage != null}" style="padding: 14px 18px; border-radius: 14px; background: #FFF1F0; border: 1.5px solid #FFA39E; color: #CF1322; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                <span>⚠️</span>
                <span th:text="${errorMessage}">Thông báo lỗi</span>
            </div>

            <!-- Reset Form -->
            <form th:action="@{/reset-password}" method="post" style="display: flex; flex-direction: column; gap: 18px;">
                <input type="hidden" name="token" th:value="${token}">

                <div>
                    <label style="font-size: 13.5px; font-weight: 800; color: var(--ssak-text-muted); text-transform: uppercase;">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" class="ssak-input" placeholder="Tối thiểu 6 ký tự" required style="margin-top: 6px;">
                </div>

                <div>
                    <label style="font-size: 13.5px; font-weight: 800; color: var(--ssak-text-muted); text-transform: uppercase;">Nhập lại mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="ssak-input" placeholder="Nhập lại đúng mật khẩu" required style="margin-top: 6px;">
                </div>

                <button type="submit" class="btn-ssak-primary" style="width: 100%; height: 50px; margin-top: 6px; font-size: 16px; font-weight: 800;">
                    Xác nhận đổi mật khẩu
                </button>
            </form>

            <div style="text-align: center; margin-top: 10px;">
                <a th:href="@{/login}" class="btn-ssak-link" style="font-size: 14px; font-weight: 700;">
                    ← Quay lại màn hình Đăng nhập
                </a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
