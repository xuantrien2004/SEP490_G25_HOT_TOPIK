<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lý thuyết · HOT TOPIK')}"></head>
<body style="background: #F8F6EF; color: #24363D; font-family: var(--font-body); margin: 0; padding: 0;">

<!-- Navbar 7 mục -->
<div th:replace="~{fragments/navbar :: navbar('theory')}"></div>

<main style="max-width: 1380px; margin: 0 auto; padding: 28px 32px; box-sizing: border-box;">

    <!-- TOP ROW: TITLE "Lý thuyết" & SEARCH INPUT -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h1 style="margin: 0; font-family: var(--font-heading); font-size: 32px; font-weight: 800; color: #24363D;">
            Lý thuyết
        </h1>

        <!-- Search Bar matching image -->
        <div style="position: relative; width: 340px;">
            <input type="text" id="theorySearchInput" oninput="handleSearch(this.value)"
                   placeholder='Tìm chủ đề, ví dụ "du lịch" hoặc "여행"'
                   style="width: 100%; height: 44px; border-radius: 14px; border: 1.5px solid #E8E5DC; background: #FFFFFF; padding: 0 16px; font-size: 13.5px; outline: none; font-family: inherit; box-sizing: border-box; color: #24363D;">
        </div>
    </div>

    <!-- 4 EQUAL TABS: Từ vựng | Ngữ pháp | Cầu nối Hán Việt | Đặc thù tiếng Hàn -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">

        <!-- Tab 1: Từ vựng -->
        <div id="tab-vocab" class="theory-main-tab" th:classappend="${currentTab == 'vocab' ? 'active' : ''}"
             onclick="location.href='/ly-thuyet?tab=vocab&level=1'">
            <div class="theory-tab-icon" style="background: #E8F5E9; color: #2E7D67;">가</div>
            <div>
                <span class="theory-tab-title">Từ vựng</span>
                <span class="theory-tab-sub">Theo chủ đề · flashcard · quiz</span>
            </div>
        </div>

        <!-- Tab 2: Ngữ pháp -->
        <div id="tab-grammar" class="theory-main-tab" th:classappend="${currentTab == 'grammar' ? 'active' : ''}"
             onclick="location.href='/ly-thuyet?tab=grammar&level=1'">
            <div class="theory-tab-icon" style="background: #EBF3F8; color: #2B6CB0;">문</div>
            <div>
                <span class="theory-tab-title">Ngữ pháp</span>
                <span class="theory-tab-sub">Theo nhóm chức năng</span>
            </div>
        </div>

        <!-- Tab 3: Cầu nối Hán Việt -->
        <a th:href="@{/ly-thuyet/han-viet}" id="tab-hanja" class="theory-main-tab" style="text-decoration: none;">
            <div class="theory-tab-icon" style="background: #FDF2EB; color: #C05621;">
                學
            </div>
            <div>
                <span class="theory-tab-title">Cầu nối Hán Việt</span>
                <span class="theory-tab-sub">Gốc chữ Hán</span>
            </div>
        </a>

        <!-- Tab 4: Đặc thù tiếng Hàn -->
        <a th:href="@{/ly-thuyet/dac-thu}" id="tab-special" class="theory-main-tab" style="text-decoration: none;">
            <div class="theory-tab-icon" style="background: #FEF9E7; color: #B7791F;">
                한
            </div>
            <div>
                <span class="theory-tab-title">Đặc thù tiếng Hàn</span>
                <span class="theory-tab-sub">Biến âm, ngữ pháp dễ nhầm</span>
            </div>
        </a>

    </div>

    <!-- LEVEL SELECTOR ROW (TOPIK 1 - 6) (only visible in Vocab & Grammar) -->
    <div style="flex-grow: 1; background: #EFECE3; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;">
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 1 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=1'">
            <span class="level-main">TOPIK 1</span>
            <span class="level-sub">Sơ cấp 1</span>
        </button>
        <!-- Làm tương tự cho level từ 2 đến 6, chỉ cần thay &level=1 thành &level=2, &level=3, ... -->
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 2 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=2'">
            <span class="level-main">TOPIK 2</span>
            <span class="level-sub">Sơ cấp 2</span>
        </button>
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 3 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=3'">
            <span class="level-main">TOPIK 3</span>
            <span class="level-sub">Trung cấp 1</span>
        </button>
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 4 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=4'">
            <span class="level-main">TOPIK 4</span>
            <span class="level-sub">Trung cấp 2</span>
        </button>
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 5 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=5'">
            <span class="level-main">TOPIK 5</span>
            <span class="level-sub">Cao cấp 1</span>
        </button>
        <button type="button" class="level-btn" th:classappend="${selectedLevel == 6 ? 'active' : ''}"
                onclick="location.href='/ly-thuyet?tab=' + (new URLSearchParams(window.location.search).get('tab') || 'vocab') + '&level=6'">
            <span class="level-main">TOPIK 6</span>
            <span class="level-sub">Cao cấp 2</span>
        </button>
    </div>

    <!-- SECTION TITLE ROW: e.g. "TOPIK 1 · 6 chủ đề" AND "11 từ chưa thuộc ➔" -->
    <div id="sectionHeaderRow" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
        <h2 id="currentCategoryTitle" style="margin: 0; font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: #24363D;">
            TOPIK 1 · 6 chủ đề
        </h2>

        <!-- Shortcut to Unlearned Words / Quiz -->
        <a th:href="@{/tu-chua-thuoc}" id="unlearnedShortcut" style="display: inline-flex; align-items: center; gap: 4px; background: #FEF9E7; color: #B7791F; border: 1.5px solid #F6E05E; padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 800; text-decoration: none; transition: background 0.15s ease;">
            11 từ chưa thuộc ➔
        </a>
    </div>

    <!-- MAIN CONTENT CARDS GRID (3 COLUMNS) -->
    <!-- MAIN CONTENT CARDS GRID (3 COLUMNS) -->
    <div id="cardsGridContainer" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">

        <!-- HIỂN THỊ KHI ĐANG Ở TAB NGỮ PHÁP -->
        <th:block th:if="${currentTab == 'grammar' and grammarGroups != null}">
            <a th:each="group : ${grammarGroups}"
               th:href="@{/theory/grammar-list(groupId=${group.id})}"
               class="topic-card" style="text-decoration: none;">
                <div class="topic-icon-box" th:text="${group.groupNo}">
                    1
                </div>
                <div style="flex-grow: 1; min-width: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
                        <span style="font-family: var(--font-heading); font-size: 15px; font-weight: 800; color: #24363D; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                              th:text="${group.nameVi}">
                            Tên nhóm
                        </span>
                        <span style="font-size: 12px; font-weight: 800; color: #2E7D67; flex-shrink: 0; margin-left: 8px;">
    Khám phá ngay
</span>
                    </div>
                    <div style="height: 6px; border-radius: 3px; background: #EFECE3; overflow: hidden;">
                        <div style="width: 100%; height: 100%; background: #2E7D67; border-radius: 3px;"></div>
                    </div>
                </div>
            </a>
        </th:block>

    </div>

</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<style>
/* 4 Main Tabs at Top */
.theory-main-tab {
    background: #FFFFFF;
    border: 1.5px solid #E8E5DC;
    border-radius: 18px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.15s ease;
}
.theory-main-tab:hover {
    border-color: #2E7D67;
}
.theory-main-tab.active {
    background: #F4FAF7;
    border: 2px solid #2E7D67;
}

.theory-tab-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-heading);
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
}

.theory-tab-title {
    display: block;
    font-family: var(--font-heading);
    font-size: 17px;
    font-weight: 800;
    color: #24363D;
}
.theory-tab-sub {
    display: block;
    font-size: 12.5px;
    color: #53646C;
    margin-top: 2px;
}

/* Level Selector Buttons */
.level-btn {
    border: none;
    background: transparent;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: all 0.15s ease;
}
.level-btn.active {
    background: #FFFFFF;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.level-btn .level-main {
    font-family: var(--font-heading);
    font-size: 14px;
    font-weight: 800;
    color: #53646C;
}
.level-btn.active .level-main {
    color: #2E7D67;
}
.level-btn .level-sub {
    font-size: 11px;
    color: #8C9BA2;
}

/* Topic Card */
.topic-card {
    background: #FFFFFF;
    border: 1.5px solid #E8E5DC;
    border-radius: 18px;
    padding: 18px 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
}
.topic-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
}
.topic-card.highlighted {
    border: 2px solid #2E7D67;
}

.topic-icon-box {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: #E8F5E9;
    color: #2E7D67;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-heading);
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
}
</style>

<script th:inline="javascript">
    let currentCategory = /*[[${currentTab}]]*/ 'vocab'; // Nhận tab hiện tại từ server ('vocab' hoặc 'grammar')
    let currentLevel = /*[[${selectedLevel != null ? selectedLevel : 1}]]*/ 1; // Nhận level đang chọn

    // Hàm chuyển tab chính (Từ vựng | Ngữ pháp | Hán Việt | Đặc thù)
    function switchTheoryCategory(cat) {
        if (cat === 'hanja') {
            window.location.href = '/ly-thuyet/han-viet';
            return;
        }
        if (cat === 'special') {
            window.location.href = '/ly-thuyet/dac-thu';
            return;
        }
        // Chuyển hướng lại URL chứa tab tương ứng để Controller load đúng dữ liệu từ DB
        window.location.href = `/ly-thuyet?tab=${cat}&level=${currentLevel}`;
    }

    // Hàm chọn cấp độ TOPIK (1 -> 6)
    function selectLevel(lvl) {
        currentLevel = lvl;
        // Reload lại trang với tab hiện tại và level mới chọn để Controller gọi Service lọc Database
        window.location.href = `/ly-thuyet?tab=${currentCategory}&level=${currentLevel}`;
    }

    // Hàm tìm kiếm nhanh trực tiếp trên giao diện
    function handleSearch(val) {
        const query = val.toLowerCase().trim();
        const cards = document.querySelectorAll('.topic-card');

        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(query)) {
                card.style.display = 'flex';
            } else {
                card.style.display = 'none';
            }
        });
    }

    // Đánh dấu active đúng tab và level khi trang vừa load xong từ Server
    document.addEventListener("DOMContentLoaded", function() {
        // Active tab
        document.querySelectorAll('.theory-main-tab').forEach(t => t.classList.remove('active'));
        const activeTabEl = document.getElementById('tab-' + currentCategory);
        if (activeTabEl) activeTabEl.classList.add('active');

        // Hiển thị/ẩn thanh chọn Level (Hanja & Special không dùng level row)
        const levelRow = document.getElementById('levelSelectorRow');
        if (currentCategory === 'vocab' || currentCategory === 'grammar') {
            levelRow.style.display = 'flex';
        } else {
            levelRow.style.display = 'none';
        }

        // Active level button
        document.querySelectorAll('.level-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (idx + 1) === currentLevel);
        });
    });
</script>
</body>
</html>
