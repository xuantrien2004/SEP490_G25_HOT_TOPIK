<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Danh sách ngữ pháp theo nhóm')}"></head>
<body style="background: #F8F6EF; color: #24363D; font-family: var(--font-body); margin: 0; padding: 0;">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('theory')}"></div>

<main style="max-width: 1000px; margin: 0 auto; padding: 32px; box-sizing: border-box;">

    <!-- Quay lại -->
    <div style="margin-bottom: 20px; font-size: 14px; color: #53646C;">
        <a th:href="@{/ly-thuyet(tab='grammar')}" style="color: #2E7D67; text-decoration: none; font-weight: 700;">← Quay lại danh sách nhóm</a>
    </div>

    <h1 style="font-family: var(--font-heading); font-size: 26px; font-weight: 800; margin-bottom: 24px; color: #24363D;">
        Danh sách mẫu ngữ pháp trong nhóm
    </h1>

    <!-- Danh sách các mẫu ngữ pháp dạng thẻ card -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
        <th:block th:if="${grammars != null and not grammars.isEmpty()}">
            <div th:each="g : ${grammars}" style="background: #FFFFFF; border: 1.5px solid #E8E5DC; border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;">
                <div>
                    <span class="korean-text" style="font-size: 18px; font-weight: 700; color: #2E7D67; display: block; margin-bottom: 4px;" th:text="${g.pattern}">-느니보다</span>
                    <span style="font-size: 14px; color: #53646C;" th:text="${g.translation}">Bản dịch tiếng Việt...</span>
                </div>

                <!-- Nút mở Popup truyền đầy đủ dữ liệu qua thuộc tính data-* -->
                <button type="button"
                        th:data-pattern="${g?.pattern}"
                        th:data-translation="${g?.translation}"
                        th:data-meaning="${g?.meaning}"
                        th:data-explanation="${g?.explanation}"
                        th:data-isfrequent="${g?.isFrequent}"
                        th:data-importancelabel="${g?.isFrequent ? 'Quan trọng' : 'Thường gặp'}"
                        th:data-exampleko="${not #lists.isEmpty(g?.examples) ? g.examples[0].sentenceKo : ''}"
                        th:data-examplevi="${not #lists.isEmpty(g?.examples) ? g.examples[0].sentenceVi : ''}"
                        onclick="openGrammarModal(this)"
                        style="background: #2E7D67; color: #FFFFFF; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 14px;">
                    Học ngay →
                </button>
            </div>
        </th:block>

        <div th:if="${grammars == null or grammars.isEmpty()}" style="text-align: center; padding: 40px; color: #8C9BA2; font-style: italic;">
            Chưa có mẫu ngữ pháp nào trong nhóm này.
        </div>
    </div>

</main>

<!-- MODAL POPUP CHI TIẾT NGỮ PHÁP -->
<div id="grammarModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #FFFFFF; width: 650px; max-width: 90%; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; max-height: 85vh; overflow-y: auto;">

        <!-- Nút đóng popup -->
        <button onclick="closeGrammarModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: #53646C;">✕</button>

        <!-- Tiêu đề và Nhãn mức độ quan trọng ở góc trên bên phải -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-right: 30px;">
            <div>
                <h2 id="modalPattern" style="font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: #2E7D67; margin: 0 0 4px 0;">Pattern</h2>
                <p id="modalTranslation" style="font-size: 14.5px; color: #53646C; margin: 0; font-weight: 600;"></p>
            </div>

            <!-- Huy hiệu hiển thị linh hoạt ở góc -->
            <span id="modalImportance" style="background: #FEF9E7; color: #B7791F; border: 1.5px solid #F6E05E; padding: 4px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; display: inline-block;">
                Quan trọng
            </span>
        </div>

        <hr style="border: none; border-top: 1px solid #E8E5DC; margin-bottom: 20px;">

        <!-- Giải thích / Cấu trúc -->
        <div style="margin-bottom: 18px;">
            <h4 style="font-size: 13.5px; font-weight: 800; color: #53646C; text-transform: uppercase; margin-bottom: 6px;">Giải thích / Cấu trúc (Explanation)</h4>
            <div id="modalExplanation" style="font-size: 14.5px; color: #24363D; background: #F8F6EF; padding: 12px 16px; border-radius: 12px; font-weight: 700; line-height: 1.5;"></div>
        </div>

        <!-- Ý nghĩa chi tiết -->
        <div style="margin-bottom: 18px;">
            <h4 style="font-size: 13.5px; font-weight: 800; color: #53646C; text-transform: uppercase; margin-bottom: 6px;">Ý nghĩa chi tiết</h4>
            <div id="modalMeaning" style="font-size: 14.5px; color: #24363D; line-height: 1.5;"></div>
        </div>

        <!-- Ví dụ câu tiếng Hàn & Dịch nghĩa -->
        <div id="modalExampleBox" style="margin-bottom: 20px; display: none;">
            <h4 style="font-size: 13.5px; font-weight: 800; color: #53646C; text-transform: uppercase; margin-bottom: 8px;">Ví dụ minh họa</h4>
            <div style="background: #F4FAF7; border: 1.5px solid #C6E7D8; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
                <div id="modalExampleKo" class="korean-text" style="font-size: 15px; font-weight: 700; color: #2E7D67;"></div>
                <div id="modalExampleVi" style="font-size: 14px; color: #53646C; font-style: italic;"></div>
            </div>
        </div>

        <!-- Nút hành động -->
        <div style="display: flex; justify-content: flex-end;">
            <button onclick="closeGrammarModal()" style="background: #2E7D67; color: #FFFFFF; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 700; cursor: pointer;">Đóng</button>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function openGrammarModal(btn) {
        const pattern = btn.getAttribute('data-pattern');
        const translation = btn.getAttribute('data-translation');
        const meaning = btn.getAttribute('data-meaning');
        const explanation = btn.getAttribute('data-explanation');
        const importanceLabel = btn.getAttribute('data-importancelabel');
        const exampleKo = btn.getAttribute('data-exampleko');
        const exampleVi = btn.getAttribute('data-examplevi');

        document.getElementById('modalPattern').textContent = pattern;
        document.getElementById('modalTranslation').textContent = "Bản dịch: " + (translation || '');
        document.getElementById('modalExplanation').textContent = explanation || 'Đang cập nhật cấu trúc...';
        document.getElementById('modalMeaning').textContent = meaning || 'Đang cập nhật ý nghĩa chi tiết...';

        // Xử lý hiển thị Ví dụ câu tiếng Hàn và tiếng Việt
        const exampleBox = document.getElementById('modalExampleBox');
        const exKoEl = document.getElementById('modalExampleKo');
        const exViEl = document.getElementById('modalExampleVi');

        if (exampleKo && exampleKo.trim() !== "") {
            exKoEl.textContent = "🇰🇷 " + exampleKo;
            exViEl.textContent = "🇻🇳 " + (exampleVi || '');
            exampleBox.style.display = 'block';
        } else {
            exampleBox.style.display = 'none';
        }

        // Hiển thị nhãn ở góc popup tùy thuộc vào isFrequent (Quan trọng có sao ⭐, Thường gặp thuần chữ)
        const impEl = document.getElementById('modalImportance');
        if (importanceLabel && importanceLabel.trim() !== "") {
            impEl.style.display = 'inline-block';

            if (importanceLabel.includes('Quan trọng')) {
                impEl.textContent = "⭐ " + importanceLabel;
                impEl.style.background = '#FEF9E7';
                impEl.style.color = '#B7791F';
                impEl.style.borderColor = '#F6E05E';
            } else {
                impEl.textContent = importanceLabel;
                impEl.style.background = '#E8F5E9';
                impEl.style.color = '#2E7D67';
                impEl.style.borderColor = '#C6E7D8';
            }
        } else {
            impEl.style.display = 'none';
        }

        document.getElementById('grammarModal').style.display = 'flex';
    }

    function closeGrammarModal() {
        document.getElementById('grammarModal').style.display = 'none';
    }

    // Đóng modal khi click ra ngoài vùng trắng
    window.onclick = function(event) {
        const modal = document.getElementById('grammarModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }
</script>

</body>
</html>
