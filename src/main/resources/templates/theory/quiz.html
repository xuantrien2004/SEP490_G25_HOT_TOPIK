<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quiz trắc nghiệm từ vựng · HOT TOPIK')}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body); min-height: 100vh;">

<header class="py-3 px-4 bg-white border-bottom shadow-sm">
    <div class="d-flex justify-content-between align-items-center" style="max-width: 860px; margin: 0 auto; width: 100%;">
        <a th:href="@{/ly-thuyet}" class="text-decoration-none fw-bold small text-muted">
            ← Thoát Quiz
        </a>
        <div class="fw-bold" style="font-family: var(--font-heading); font-size: 18px; color: var(--ssak-primary);">
            Quiz Từ vựng: Môi trường (10 câu)
        </div>
        <span class="badge bg-light text-muted border">Tự động chấm</span>
    </div>
</header>

<main class="container my-5" style="max-width: 760px;">
    
    <!-- Thanh tiến độ theo mục 10.1 (không ghi Câu x/y bằng chữ) -->
    <div class="mb-4">
        <div class="progress" style="height: 10px; border-radius: 5px;">
            <div class="progress-bar" id="quizProgressBar" style="width: 30%; background-color: var(--ssak-primary);"></div>
        </div>
    </div>

    <!-- KHUNG CÂU HỎI QUIZ -->
    <div class="p-4 p-md-5 rounded-5 bg-white border shadow-sm mb-4" id="quizQuestionBox">
        <span class="badge bg-light text-muted border mb-3">Chọn nghĩa đúng của từ tiếng Hàn sau:</span>
        <h2 style="font-family: var(--font-korean); font-size: 38px; font-weight: 800; color: var(--ssak-primary);" class="mb-4" id="quizWord">
            재활용 (jaehwalyong)
        </h2>

        <!-- 4 Lựa chọn -->
        <div class="d-flex flex-column gap-3 mb-4" id="quizOptions">
            <button class="btn btn-outline-secondary p-3 rounded-4 text-start fw-bold fs-6 quiz-opt" onclick="answerQuiz(this, false)">
                A. Khai thác tài nguyên thiên nhiên
            </button>
            <button class="btn btn-outline-secondary p-3 rounded-4 text-start fw-bold fs-6 quiz-opt" onclick="answerQuiz(this, true)">
                B. Tái chế rác thải sinh hoạt
            </button>
            <button class="btn btn-outline-secondary p-3 rounded-4 text-start fw-bold fs-6 quiz-opt" onclick="answerQuiz(this, false)">
                C. Xử lý nước thải công nghiệp
            </button>
            <button class="btn btn-outline-secondary p-3 rounded-4 text-start fw-bold fs-6 quiz-opt" onclick="answerQuiz(this, false)">
                D. Bảo tồn động vật quý hiếm
            </button>
        </div>

        <div class="d-flex justify-content-end">
            <button class="btn-ssak-primary px-4 py-2 rounded-pill fw-bold" id="nextQuizBtn" disabled onclick="nextQuizQuestion()">
                Câu tiếp theo <i class="bi bi-chevron-right ms-1"></i>
            </button>
        </div>
    </div>

    <!-- KHUNG KẾT QUẢ QUIZ THEO MỤC 10.1 (Ẩn mặc định) -->
    <div class="p-4 p-md-5 rounded-5 bg-white border shadow-sm text-center d-none" id="quizResultBox">
        <div th:replace="~{fragments/ssak :: mascot('happy', 'bloom', 150, 'Bé Ssak hoa nở')}"></div>
        <h2 style="font-family: var(--font-heading); font-size: 32px; font-weight: 800;" class="mt-3 mb-1">
            Đúng 8 / 10 câu
        </h2>
        <p class="text-muted">Hoàn thành bài Quiz từ vựng chủ đề Môi trường</p>

        <!-- 2 Ô: Đã thuộc / Chưa thuộc (không thống kê thời gian) theo mục 10.1 -->
        <div class="row g-3 my-4">
            <div class="col-6">
                <div class="p-3 rounded-4" style="background: var(--ssak-primary-light);">
                    <div class="fs-4 fw-bold text-success" style="color: var(--ssak-primary) !important;">8 từ</div>
                    <small class="text-muted fw-bold">Đã thuộc</small>
                </div>
            </div>
            <div class="col-6">
                <div class="p-3 rounded-4" style="background: #FBE6DA;">
                    <div class="fs-4 fw-bold" style="color: var(--ssak-terracotta);">2 từ</div>
                    <small class="text-muted fw-bold">Chưa thuộc (vào danh sách)</small>
                </div>
            </div>
        </div>

        <!-- 3 Nút hành động theo mục 10.1 -->
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a th:href="@{/ly-thuyet/the}" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-bold">
                Học lại 2 từ chưa thuộc
            </a>
            <button type="button" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold" onclick="location.reload()">
                Làm quiz lại
            </button>
            <a th:href="@{/ly-thuyet/tu-vung/moi-truong}" class="btn-ssak-primary rounded-pill px-4 py-2 fw-bold text-decoration-none">
                Về chủ đề →
            </a>
        </div>
    </div>

</main>

<script>
    function answerQuiz(btn, isCorrect) {
        document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
        if(isCorrect) {
            btn.className = 'btn btn-success p-3 rounded-4 text-start fw-bold fs-6';
            btn.style.backgroundColor = 'var(--ssak-primary)';
        } else {
            btn.className = 'btn btn-danger p-3 rounded-4 text-start fw-bold fs-6';
        }
        document.getElementById('nextQuizBtn').removeAttribute('disabled');
    }

    function nextQuizQuestion() {
        document.getElementById('quizQuestionBox').classList.add('d-none');
        document.getElementById('quizResultBox').classList.remove('d-none');
    }
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
