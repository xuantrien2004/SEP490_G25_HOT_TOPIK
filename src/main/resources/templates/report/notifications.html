<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body style="background: var(--ssak-bg, #F4F3EF); color: var(--ssak-text-main, #24363D); font-family: var(--font-body, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);">

<div th:replace="~{fragments/navbar :: navbar('notifications')}"></div>

<main class="container py-4" style="max-width: 860px; min-height: 85vh;">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1" style="font-family: var(--font-heading); color: #164E40;">🔔 Thông báo của tôi</h1>
            <p class="text-muted small mb-0">Cập nhật phản hồi báo lỗi câu hỏi và nhắc nhở học tập từ hệ thống</p>
        </div>
        <a th:href="@{/practice}" class="btn btn-outline-success btn-sm rounded-3">📚 Tiếp tục luyện tập</a>
    </div>

    <div class="bg-white border rounded-4 p-4 shadow-sm">
        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
            <span style="font-size: 48px;">📭</span>
            <h5 class="fw-bold mt-2">Chưa có thông báo nào</h5>
            <p class="small mb-0">Khi bạn báo lỗi câu hỏi hoặc hoàn thành bài luyện, các thông báo phản hồi sẽ xuất hiện tại đây.</p>
        </div>

        <div th:unless="${#lists.isEmpty(notifications)}" class="d-flex flex-column gap-3">
            <div th:each="n : ${notifications}"
                 class="p-3 rounded-3 border transition-all d-flex justify-content-between align-items-start gap-3"
                 th:style="${!n.read ? 'background: #F0FDF4; border-color: #86EFAC !important;' : 'background: #FFFFFF;'}"
                 th:id="'noti-' + ${n.id}">
                
                <div class="d-flex align-items-start gap-3">
                    <span style="font-size: 24px;" th:text="${n.type == 'REPORT_RESOLVED' ? '🎁' : (n.type == 'REPORT_REJECTED' ? 'ℹ️' : '🔔')}">🔔</span>
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h6 class="fw-bold mb-0 text-dark" th:text="${n.title}">Tiêu đề</h6>
                            <span th:unless="${n.read}" class="badge bg-danger rounded-pill" style="font-size: 10px;">Mới</span>
                        </div>
                        <p class="text-muted mb-2" style="font-size: 14px; line-height: 1.5;" th:text="${n.message}">Nội dung thông báo...</p>
                        <div class="small text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</div>
                    </div>
                </div>

                <div class="d-flex flex-column align-items-end gap-2 flex-shrink-0">
                    <a th:if="${n.link != null}" th:href="${n.link}"
                       class="btn btn-sm btn-success rounded-3 fw-bold px-3"
                       th:onclick="'markRead(' + ${n.id} + ')'">
                        Xem chi tiết →
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function markRead(id) {
        fetch('/api/notifications/' + id + '/read', { method: 'POST', keepalive: true });
    }
</script>
</body>
</html>
