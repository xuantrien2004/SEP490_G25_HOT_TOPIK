<div th:fragment="fields">
    <div id="goalSpan" th:data-start="${spanStart}" th:data-live="${liveSpan}">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold">Học trong bao lâu</span>
            <span class="badge text-bg-light border" id="goalSpanNote" th:text="${goalDays} + ' ngày'">90 ngày</span>
        </div>
        <div class="row g-2 mb-3" id="dayMarks">
            <div class="col-6 col-md-3" th:each="mark : ${dayMarks}">
                <button type="button" class="span-choice"
                        th:classappend="${mark.days == goalDays} ? 'is-on'"
                        th:data-days="${mark.days}"
                        th:attr="onclick=|setGoalDays(${mark.days})|">
                    <span th:text="${mark.label}">3 tháng</span>
                    <small th:text="${mark.days} + ' ngày'">90 ngày</small>
                </button>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-sm-4">
                <label class="fw-bold" for="goalDays">Số ngày
                    <input id="goalDays" class="form-control mt-1" type="number" name="days" required
                           th:min="${minDays}" th:max="${maxDays}" th:value="${goalDays}">
                </label>
            </div>
            <div class="col-sm-8">
                <label class="fw-bold" for="goalDate">Ngày muốn đạt
                    <input id="goalDate" class="form-control mt-1" type="date" name="date" required
                           th:min="${earliest}" th:max="${latest}" th:value="${goalDate}">
                </label>
            </div>
        </div>
        <p class="text-muted small mt-2 mb-0">Từ 31 đến 200 ngày. Gõ số ngày thì lịch đổi theo. Chọn lịch thì số ngày đổi theo.</p>
    </div>
    <style>
        .span-choice {
            width: 100%; border: 1.5px solid #E6E1D6; background: #fff; color: #24363D;
            border-radius: 16px; padding: 12px; font-weight: 800; text-align: left;
        }
        .span-choice small { display: block; font-weight: 700; color: #6A7A80; margin-top: 2px; }
        .span-choice.is-on { background: #1F6B56; border-color: #1F6B56; color: #fff; }
        .span-choice.is-on small { color: rgba(255,255,255,.85); }
    </style>
    <script>
        function goalIso(date) {
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var day = String(date.getDate()).padStart(2, '0');
            return date.getFullYear() + '-' + month + '-' + day;
        }
        function goalStart() {
            var root = document.getElementById('goalSpan');
            var raw = root ? root.getAttribute('data-start') : '';
            var date = raw ? new Date(raw + 'T12:00:00') : new Date();
            date.setHours(12, 0, 0, 0);
            return date;
        }
        function goalEnd(span) {
            var date = goalStart();
            date.setDate(date.getDate() + span - 1);
            return date;
        }
        function paintGoal(span, end) {
            var note = document.getElementById('goalSpanNote');
            if (note) note.textContent = span + ' ngày · ' + end.toLocaleDateString('vi-VN');
            document.querySelectorAll('#dayMarks button').forEach(function (button) {
                button.classList.toggle('is-on', Number(button.dataset.days) === span);
            });
        }
        function applyGoalDays() {
            var days = document.getElementById('goalDays');
            var date = document.getElementById('goalDate');
            var span = parseInt(days.value, 10);
            var min = parseInt(days.min, 10);
            var max = parseInt(days.max, 10);
            if (!Number.isFinite(span)) return;
            span = Math.min(max, Math.max(min, span));
            days.value = span;
            var end = goalEnd(span);
            date.value = goalIso(end);
            paintGoal(span, end);
        }
        function applyGoalDate() {
            var days = document.getElementById('goalDays');
            var date = document.getElementById('goalDate');
            if (!date.value) return;
            var end = new Date(date.value + 'T12:00:00');
            var start = goalStart();
            var span = Math.round((end - start) / 86400000) + 1;
            var min = parseInt(days.min, 10);
            var max = parseInt(days.max, 10);
            if (span < min) span = min;
            if (span > max) span = max;
            end = goalEnd(span);
            days.value = span;
            date.value = goalIso(end);
            paintGoal(span, end);
        }
        function setGoalDays(value) {
            var days = document.getElementById('goalDays');
            days.value = value;
            applyGoalDays();
            var root = document.getElementById('goalSpan');
            if (root && root.getAttribute('data-live') === 'true') days.form.submit();
        }
        document.getElementById('goalDays').addEventListener('input', applyGoalDays);
        document.getElementById('goalDate').addEventListener('input', applyGoalDate);
        document.getElementById('goalDays').form.addEventListener('submit', function () {
            if (document.activeElement && document.activeElement.id === 'goalDays') applyGoalDays();
            else applyGoalDate();
        });
    </script>
</div>
