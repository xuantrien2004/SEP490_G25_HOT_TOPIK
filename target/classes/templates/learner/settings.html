<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cài đặt học tập · HOT TOPIK')}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body); min-height: 100vh;">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar('today')}"></div>

<main class="container my-5" style="max-width: 860px;">
    <div class="mb-4">
        <h1 style="font-family: var(--font-heading); font-size: 32px; font-weight: 800; margin: 0;">
            Cài đặt học tập
        </h1>
        <p class="text-muted small mt-1">Tùy chỉnh mục tiêu hàng ngày, thông báo và trải nghiệm học tập cùng Bé Ssak.</p>
    </div>

    <div class="p-4 p-md-5 rounded-5 bg-white border shadow-sm">
        <form onsubmit="event.preventDefault(); alert('Đã lưu toàn bộ cài đặt thành công!');">
            
            <!-- 1. Mục tiêu phút học mỗi ngày theo mục 3.6 -->
            <div class="mb-4 pb-4 border-bottom">
                <label class="form-label fw-bold small text-muted">1. MỤC TIÊU PHÚT HỌC MỖI NGÀY</label>
                <div class="d-flex flex-wrap gap-2 mb-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setGoal(10)">10 phút</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setGoal(15)">15 phút</button>
                    <button type="button" class="btn btn-sm btn-success rounded-pill px-3 fw-bold" style="background: var(--ssak-primary) !important;" onclick="setGoal(20)">20 phút (Mặc định)</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setGoal(30)">30 phút</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setGoal(45)">45 phút</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setGoal(60)">60 phút</button>
                </div>
                <div class="row g-2 align-items-center">
                    <div class="col-sm-4">
                        <input type="number" class="form-control rounded-3" id="customMinutes" value="20" min="5" max="180">
                    </div>
                    <div class="col-sm-8 text-muted small">
                        * Áp dụng từ hôm nay để chốt Chuỗi đủ giờ (Streak).
                    </div>
                </div>
            </div>

            <!-- 2. Nhắc học & Múi giờ -->
            <div class="mb-4 pb-4 border-bottom">
                <label class="form-label fw-bold small text-muted">2. NHẮC HỌC & MÚI GIỜ</label>
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label class="small text-muted mb-1">Múi giờ hệ thống:</label>
                        <select class="form-select rounded-3">
                            <option selected>Asia/Ho_Chi_Minh (GMT+7 · Việt Nam)</option>
                            <option>Asia/Seoul (GMT+9 · Hàn Quốc)</option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted mb-1">Giờ nhắc nhở hàng ngày:</label>
                        <input type="time" class="form-control rounded-3" value="20:00">
                    </div>
                </div>
                <div class="form-check form-switch mt-3">
                    <input class="form-check-input" type="checkbox" id="emailReminder" checked>
                    <label class="form-check-label small" for="emailReminder">Nhận email nhắc nhở nếu chưa đạt mục tiêu học trước 21:00</label>
                </div>
            </div>

            <!-- 3. Giao diện & Hiển thị -->
            <div class="mb-4 pb-4 border-bottom">
                <label class="form-label fw-bold small text-muted">3. GIAO DIỆN & PHÁT ÂM</label>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="small text-muted mb-1">Cỡ chữ hiển thị đoạn văn:</label>
                        <select class="form-select rounded-3">
                            <option selected>Bình thường (16px chuẩn WCAG)</option>
                            <option>Cỡ chữ lớn (18px dễ nhìn)</option>
                        </select>
                    </div>
                    <div class="col-sm-6">
                        <label class="small text-muted mb-1">Tốc độ audio mặc định khi luyện tập:</label>
                        <select class="form-select rounded-3">
                            <option selected>1.0x (Tốc độ thi thật)</option>
                            <option>0.8x (Chậm, nghe rõ phát âm)</option>
                        </select>
                    </div>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="showRoman" checked>
                    <label class="form-check-label small" for="showRoman">Hiển thị phiên âm La-tinh ở phần tra cứu từ vựng</label>
                </div>
            </div>

            <!-- 4. Đăng xuất khỏi mọi thiết bị theo mục 3.7 -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <button type="button" class="btn btn-outline-danger rounded-pill px-4 py-2" onclick="if(confirm('Bạn có chắc muốn đăng xuất khỏi toàn bộ các thiết bị khác?')) alert('Đã hủy các phiên đăng nhập cũ.');">
                    <i class="bi bi-shield-x me-1"></i>Đăng xuất khỏi mọi thiết bị
                </button>
                <button type="submit" class="btn-ssak-primary rounded-pill px-5 py-2 fw-bold">
                    Lưu cài đặt
                </button>
            </div>
        </form>
    </div>
</main>

<script>
    function setGoal(min) {
        document.getElementById('customMinutes').value = min;
    }
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
