<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trang chủ học viên · HOT TOPIK')}"></head>
<body style="background: var(--ssak-bg); color: var(--ssak-text-main); font-family: var(--font-body); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

<!-- Navbar học viên 7 mục -->
<div th:replace="~{fragments/navbar :: navbar('home')}"></div>

<main class="container my-auto py-5" style="max-width: 1140px;">
    <!-- Banner Học viên theo Prototype v21 -->
    <div class="p-4 p-md-5 rounded-5 position-relative overflow-hidden shadow-lg border"
         style="background: linear-gradient(135deg, #E3F2EA 0%, #FBF0D3 65%, #FBE6DA 100%); border-color: var(--ssak-primary-border) !important;">
        
        <!-- Tia sáng và Confetti -->
        <div style="position: absolute; right: -40px; top: -40px; width: 320px; height: 320px; background: radial-gradient(circle, rgba(244,196,90,0.4) 0%, transparent 70%); pointer-events: none;"></div>
        <div style="position: absolute; left: 6%; top: 20px; font-size: 24px;">✨</div>
        <div style="position: absolute; right: 28%; top: 25px; font-size: 20px;">🌿</div>
        <div style="position: absolute; right: 6%; bottom: 30px; font-size: 24px;">🎉</div>

        <div class="row align-items-center g-4">
            <div class="col-lg-7">
                <!-- Nhãn chào mừng -->
                <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-white mb-3 shadow-sm border" style="border-color: var(--ssak-primary) !important;">
                    <span class="badge rounded-pill bg-success px-2 py-1" style="background-color: var(--ssak-primary) !important; font-size: 11px;">MỤC TIÊU</span>
                    <span class="fw-bold" style="font-size: 13px;" th:text="'Chào mừng trở lại, ' + (${session.LOGGED_IN_USER != null ? session.LOGGED_IN_USER.fullName : 'Minh Anh'}) + '!'">Chào mừng trở lại, Minh Anh!</span>
                </div>

                <!-- Tiêu đề bứt phá -->
                <h1 style="font-family: var(--font-heading); font-size: clamp(32px, 4.5vw, 48px); font-weight: 800; line-height: 1.15; color: var(--ssak-text-main);">
                    Hôm nay mình bứt phá tiếp nhé!
                </h1>
                
                <p class="lead mt-3 mb-4" style="color: var(--ssak-text-muted); font-size: 18px; line-height: 1.5;">
                    Còn <strong>48 ngày</strong> đến kỳ thi TOPIK. Hôm nay bạn có <strong>2 bài</strong> trong lộ trình học tập.
                </p>

                <!-- 2 Nút chính theo v21: "Vào học hôm nay" & "Xem lộ trình" -->
                <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
                    <a th:href="@{/hom-nay}" class="btn-ssak-primary" style="height: 54px; padding: 0 32px; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border-radius: var(--radius-pill); font-weight: 800;">
                        <i class="bi bi-play-fill me-2 fs-4"></i>Vào học hôm nay
                    </a>
                    <a th:href="@{/lo-trinh}" class="btn-ssak-outline" style="height: 54px; padding: 0 28px; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; border-radius: var(--radius-pill); background: #FFFFFF; font-weight: 700;">
                        <i class="bi bi-calendar3 me-2"></i>Xem lộ trình
                    </a>
                </div>

                <!-- 3 Ô nhỏ theo v21: Mục tiêu, Còn lại, Hôm nay -->
                <div class="row g-2 pt-2 border-top" style="border-color: rgba(46,125,103,0.2) !important;">
                    <div class="col-4">
                        <div class="p-2 p-sm-3 bg-white rounded-4 border text-center shadow-sm">
                            <small class="text-muted d-block" style="font-size: 12px; font-weight: 700;">Mục tiêu</small>
                            <span class="fw-bold" style="font-size: 16px; color: var(--ssak-primary-dark);">TOPIK 4</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 p-sm-3 bg-white rounded-4 border text-center shadow-sm">
                            <small class="text-muted d-block" style="font-size: 12px; font-weight: 700;">Còn lại</small>
                            <span class="fw-bold" style="font-size: 16px; color: #7A5A12;">48 ngày</span>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 p-sm-3 bg-white rounded-4 border text-center shadow-sm">
                            <small class="text-muted d-block" style="font-size: 12px; font-weight: 700;">Hôm nay</small>
                            <span class="fw-bold" style="font-size: 16px; color: var(--ssak-primary);">1/2 bài</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bé Ssak giơ băng rôn "화이팅!" và bóng thoại "Cùng cố lên nhé!" -->
            <div class="col-lg-5 text-center position-relative">
                <div class="p-3 d-inline-block position-relative">
                    <!-- Bóng thoại "Cùng cố lên nhé!" -->
                    <div class="speech-bubble shadow-sm px-3 py-2 rounded-4 bg-white position-absolute" 
                         style="top: 0; left: 10px; border: 2px solid var(--ssak-primary); font-size: 15px; font-weight: 800; color: var(--ssak-primary-dark); z-index: 10;">
                        Cùng cố lên nhé! 🌿
                    </div>
                    
                    <!-- Băng rôn "화이팅!" -->
                    <div class="position-absolute shadow" style="bottom: 25px; left: 50%; transform: translateX(-50%) rotate(-3deg); background: #F4C45A; border: 2px solid #7A5A12; color: #7A5A12; font-family: var(--font-korean); font-size: 24px; font-weight: 900; padding: 6px 32px; border-radius: 999px; z-index: 10; white-space: nowrap;">
                        화이팅!
                    </div>

                    <!-- Bé Ssak -->
                    <div th:replace="~{fragments/ssak :: mascot('cheer', 'young', 280, 'Bé Ssak cổ vũ')}"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
