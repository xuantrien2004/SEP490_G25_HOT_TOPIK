<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chuẩn bị bài luyện · HOT TOPIK')}"></head>
<body>
<div style="min-width: 1280px; max-width: 1440px; min-height: 100vh; margin: 0 auto; background: var(--ssak-bg); display: flex; flex-direction: column;">
    <div th:replace="~{fragments/navbar :: navbar('practice')}"></div>

    <main style="flex-grow: 1; padding: 48px 120px; display: flex; justify-content: center; align-items: center;">
        <div class="ssak-card" style="width: 100%; max-width: 640px; padding: 36px; display: flex; flex-direction: column; gap: 20px; text-align: center;">
            <div style="margin: 0 auto;">
                <div th:replace="~{fragments/ssak :: mascot('happy', 'sprout', 100, 'Ssak sẵn sàng')}"></div>
            </div>
            <h1 style="margin: 0; font-family: var(--font-heading); font-size: 30px; font-weight: 800;">
                Chuẩn bị bài: Đọc 13–15 · Sắp xếp câu
            </h1>
            <p style="margin: 0; font-size: 15px; color: var(--ssak-text-muted); line-height: 1.6;">
                Mục tiêu của bài này là nhận biết liên từ chuyển ý và tìm câu giới thiệu chủ đề chung trong đoạn văn ngắn.
            </p>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0;">
                <div style="padding: 12px; border-radius: 14px; background: var(--ssak-bg);">
                    <div style="font-weight: 800; font-size: 18px;">6 câu</div>
                    <div style="font-size: 12px; color: var(--ssak-text-muted);">Số lượng câu hỏi</div>
                </div>
                <div style="padding: 12px; border-radius: 14px; background: var(--ssak-bg);">
                    <div style="font-weight: 800; font-size: 18px;">12 phút</div>
                    <div style="font-size: 12px; color: var(--ssak-text-muted);">Thời gian ước tính</div>
                </div>
                <div style="padding: 12px; border-radius: 14px; background: var(--ssak-bg);">
                    <div style="font-weight: 800; font-size: 18px; color: var(--ssak-honey-text);">+3 Xu</div>
                    <div style="font-size: 12px; color: var(--ssak-text-muted);">Phần thưởng</div>
                </div>
            </div>

            <div style="display: flex; gap: 12px; justify-content: center;">
                <a th:href="@{/today}" class="btn-ssak-outline" style="height: 48px; padding: 0 20px;">Để sau</a>
                <a th:href="@{/practice/play(mode='practice')}" class="btn-ssak-primary" style="height: 48px; padding: 0 32px; font-size: 16px; text-decoration: none;">
                    Bắt đầu làm bài ngay →
                </a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
